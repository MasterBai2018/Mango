# ============================================================================
# 并发调度配置 (Concurrency Scheduler)
# max_launch_gap_sec: 最大并发运行时，进程之间启动的时间间隔，默认为10s
# min_launch_gap_sec: 最小并发运行时，进程之间启动的时间间隔，默认为0s
# ============================================================================
[Concurrency]
max_launch_gap_sec = 10
min_launch_gap_sec = 0

# ============================================================================
# NANO TEXT_DATA 文本转音频配置
# 说明：
# 1. lang 枚举建议：cmn/eng/chuan/jap/thai/yue
# 2. engine=auto 时按以下策略路由：
#    - volcano_only_langs: 固定 volcano，失败即报错
#    - edge_only_langs: 固定 edge-tts，失败即报错
#    - cmn_auto_chain: 中文/中英混合降级链
#    - eng_auto_chain: 英文降级链
# ============================================================================
[NANOText2Audio]
audio_cache_path = TestAudio/TTS_DATA
audio_cache_db = TestAudio/TTS_DATA/tts_audio_cache.db
request_timeout_sec = 30
silence_pad_ms = 1000

# engine=auto 时，以下语种只走 volcano（失败无降级）
volcano_only_langs = chuan

# engine=auto 时，以下语种只走 edge-tts（失败无降级）
edge_only_langs = yue,jap,thai

# 中文/中英混合 自动降级链
cmn_auto_chain = edge_tts,volcano,index_tts,voxCpm

# 英文 自动降级链（可按需调整）
eng_auto_chain = edge_tts,volcano,index_tts,voxCpm

# volcano 配置
volcano_api_url = https://openspeech.bytedance.com/api/v1/tts
volcano_appid = test_mango_id
volcano_access_token = test_mango_id
volcano_cluster = volcano_tts
volcano_uid = mango
volcano_voice_cmn = zh_female_shuangkuaisisi_emo_v2_mars_bigtts
volcano_voice_eng = en_male_adam_mars_bigtts
volcano_voice_chuan = zh_female_daimengchuanmei_moon_bigtts

# edge-tts 音色
edge_voice_cmn = zh-CN-XiaoxiaoNeural
edge_voice_eng = en-US-JennyNeural
edge_voice_jap = ja-JP-NanamiNeural
edge_voice_thai = th-TH-PremwadeeNeural
edge_voice_yue = zh-HK-HiuGaaiNeural

# index_tts / voxCpm 接口
index_tts_api = http://192.168.130.37:8000/api/tts
voxcpm_quick_api = http://192.168.128.32:9876/api/tts_quick
