# ============================================================================
# 依赖库配置（Artifact配置）
# ============================================================================
# 格式：[artifact:依赖库标识名]
# jenkins: 引用的Jenkins服务器标识名（对应上面的[jenkins:xxx]）
# artifacts: 多个artifact路径，用逗号分隔
#           或者使用多行格式，每行一个artifact
# ============================================================================
[artifact:24mm-aibs]
jenkins = TSPSpeechEngine
artifacts = artifact/package/AIBS/x86-linux/_short_block/lib/libAIBSClientDynamic.so, \
            artifact/package/AIBS/x86-linux/_short_block/bin/AIBSService, \
            artifact/package/Carplay/x86-linux/lib/libCarplay_SDK.so, \
            artifact/package/ECNR/x86-linux/lib/libNR_dynamic.so, \
            artifact/package/AIBS/x86-linux/_short_block/lib/libSpeechEngineAPIDynamic.so, \
            artifact/package/AIBS/x86-linux/_short_block/bin/SpeechEnginebin

[artifact:24mm-lcs-mp]
jenkins = LCSEngine-mp
artifacts = artifact/Source/release/lcs-*-amd64.tar.gz|*extras*

[artifact:24mm-lcs-1]
jenkins = LCSEngine-1
# 使用通配符匹配，下载 lcs-*-amd64.tar.gz，但排除包含 extras 的文件, 格式: 匹配模式|排除模式1,排除模式2
artifacts = artifact/Source/release/lcs-*-amd64.tar.gz|*extras*

[artifact:24mm-lcs-2]
jenkins = LCSEngine-2
# 使用通配符匹配，下载 lcs-*-amd64.tar.gz，但排除包含 extras 的文件, 格式: 匹配模式|排除模式1,排除模式2
artifacts = artifact/Source/release/lcs-*-amd64.tar.gz|*extras*

[artifact:24mm-lcs-3]
jenkins = LCSEngine-3
# 使用通配符匹配，下载 lcs-*-amd64.tar.gz，但排除包含 extras 的文件, 格式: 匹配模式|排除模式1,排除模式2
artifacts = artifact/Source/release/lcs-*-amd64.tar.gz|*extras*

[artifact:pstt-libs]
jenkins = PSTT
artifacts = artifact/output/client/pstt_client, \
            artifact/output/client/pstt_ctrl, \
            artifact/output/vad/bin/hawkvad_mp, \
            ws/build_pstt/client/c++/pstt_client_qa

[artifact:bev-aibs]
jenkins = TSPSpeechEngine-BEV
artifacts = artifact/package/AIBS/x86-linux/lib/libAIBSClientDynamic.so, \
            artifact/package/AIBS/x86-linux/bin/AIBSService, \
            artifact/package/Carplay/x86-linux/lib/libCarplay_SDK.so, \
            artifact/package/ECNR/x86-linux/lib/libNR_dynamic.so, \
            artifact/package/AIBS/x86-linux/lib/libSpeechEngineAPIDynamic.so, \
            artifact/package/AIBS/x86-linux/bin/SpeechEnginebin

[artifact:800d-aibs]
jenkins = TSPSpeechEngine
artifacts = artifact/package/AIBS/x86-linux/lib/libAIBSClientDynamic.so, \
            artifact/package/AIBS/x86-linux/bin/AIBSService, \
            artifact/package/Carplay/x86-linux/lib/libCarplay_SDK.so, \
            artifact/package/ECNR/x86-linux/lib/libNR_dynamic.so, \
            artifact/package/AIBS/x86-linux/lib/libSpeechEngineAPIDynamic.so, \
            artifact/package/AIBS/x86-linux/bin/SpeechEnginebin

[artifact:800d-lcs]
jenkins = LCSEngine-800d
# 使用通配符匹配，下载 lcs-*-amd64.tar.gz，但排除包含 extras 的文件, 格式: 匹配模式|排除模式1,排除模式2
artifacts = /artifact/Source/release/lcs-*-amd64.tar.gz|*extras*

[artifact:seres-libs]
